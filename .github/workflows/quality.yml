name: Quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-linux.lock -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/check-quality.ps1
        shell: pwsh
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U synapse'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://synapse:synapse@localhost:5432/synapse_ci_test
      TEST_DATABASE_ADMIN_URL: postgresql://synapse:synapse@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-linux.lock -r backend/requirements-dev.txt
      - run: python -m pytest -m integration -q
        working-directory: backend
