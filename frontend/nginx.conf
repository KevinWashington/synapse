server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* (^|/)(\.[^/]+|[^/]*\.env(?:\.[^/]*)?)(/|$) {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
