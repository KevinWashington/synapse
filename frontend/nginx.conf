server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* (^|/)(\.[^/]+|[^/]*\.env(?:\.[^/]*)?)(/|$) {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The stock mime.types has no .mjs entry; browsers refuse module workers
    # (pdf.js) served as application/octet-stream.
    location ~* ^/assets/.+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
