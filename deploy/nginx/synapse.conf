server {
    listen 80;
    server_name synapse.labit.dev.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name synapse.labit.dev.br;
    ssl_certificate /etc/letsencrypt/live/synapse.labit.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synapse.labit.dev.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 50m;

    # Do not send sensitive-looking paths to the SPA fallback.
    location ~* (^|/)(\.[^/]+|[^/]*\.env(?:\.[^/]*)?)(/|$) {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:15000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:15000;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:15000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
