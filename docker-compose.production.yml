x-app: &app
  image: synapse-backend:${SYNAPSE_IMAGE_TAG:-production}
  env_file: production.env
  environment: &app-environment
    DATABASE_URL: postgresql+asyncpg://synapse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/synapse
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    QDRANT_URL: http://qdrant:6333
    QDRANT_COLLECTION: articles
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=100"]
    volumes:
      - production-postgres:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: synapse-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - production-neo4j:/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: synapse-qdrant
    volumes:
      - production-qdrant:/qdrant/storage
    mem_limit: 384m
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "migrate_database.py"]
    mem_limit: 512m
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant-init:
    <<: *app
    command: ["python", "init_qdrant.py"]
    mem_limit: 256m
    restart: "no"
    depends_on:
      qdrant:
        condition: service_started

  backend:
    <<: *app
    build: ./backend
    container_name: synapse-backend
    ports:
      - "127.0.0.1:15000:5000"
    mem_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  synthesis-worker:
    <<: *app
    container_name: synapse-synthesis-worker
    command: ["python", "-m", "app.synthesis_worker"]
    mem_limit: 384m
    depends_on:
      backend:
        condition: service_healthy

  index-worker:
    <<: *app
    container_name: synapse-index-worker
    command: ["python", "-m", "app.index_worker"]
    mem_limit: 384m
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: synapse-frontend:${SYNAPSE_IMAGE_TAG:-production}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://synapse.labit.dev.br
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
        VITE_SESSION_COOKIE_NAME: synapse_session
        VITE_BASE_PATH: /
    container_name: synapse-frontend
    ports:
      - "127.0.0.1:13000:3000"
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  production-postgres:
  production-neo4j:
  production-qdrant:
